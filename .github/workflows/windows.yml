# Gera o instalador do Windows (BoomCalc-Setup.exe) nos servidores do GitHub, sem precisar de um PC com Windows,
# e TESTA tudo num Windows de verdade antes de entregar: abre o executável, salva uma simulação, gera um PDF,
# instala, abre o programa instalado e desinstala. Se qualquer passo falhar, a execução fica vermelha.
#
# Como usar: no GitHub, aba "Actions" > "Instalador do Windows" > "Run workflow". Ao terminar (cerca de 5 a
# 10 minutos), baixe o arquivo "BoomCalc-Setup" na seção "Artifacts" da execução.
name: Instalador do Windows

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Conferir o projeto (senhas e arquivos)
        run: python empacotar/verificar_antes_de_empacotar.py

      - name: Gerar o executável
        run: python -m PyInstaller empacotar/boomcalc.spec --noconfirm --clean

      - name: Testar o executável (abrir, salvar uma simulação, gerar PDF e encerrar)
        shell: pwsh
        run: |
          $dados = Join-Path $env:RUNNER_TEMP "bc-teste"
          $proc = Start-Process -FilePath "dist\BoomCalc\BoomCalc.exe" -ArgumentList "--no-browser","--port","5099","--datadir",$dados -PassThru
          try {
            $pronto = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 1
              try { $g = Invoke-RestMethod -Uri "http://127.0.0.1:5099/api/guindastes"; if ($g.Count -ge 2) { $pronto = $true; break } } catch { }
            }
            if (-not $pronto) { throw "O executável não respondeu em 40 segundos." }
            Write-Host "API respondeu: $($g.Count) guindastes."
            $corpo = '{"guindaste_id":2,"comprimento_lanca_m":14.1,"angulo_graus":50,"raio_operacao_m":6.2,"peso_carga_kg":2000,"salvar":true}'
            $s = Invoke-RestMethod -Uri "http://127.0.0.1:5099/api/simular" -Method Post -ContentType "application/json" -Body $corpo
            if (-not $s.simulacao_id) { throw "A simulação não foi salva." }
            $pdf = Invoke-WebRequest -Uri "http://127.0.0.1:5099/api/simulacoes/$($s.simulacao_id)/relatorio?formato=pdf" -UseBasicParsing
            if ($pdf.Content.Length -lt 1000) { throw "O PDF veio vazio." }
            $pagina = Invoke-WebRequest -Uri "http://127.0.0.1:5099/" -UseBasicParsing
            if ($pagina.Content -notmatch "BOOMCALC") { throw "A página inicial não abriu." }
            Write-Host "Simulação #$($s.simulacao_id) salva, PDF de $($pdf.Content.Length) bytes e página inicial ok."
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Instalar o Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar o instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" empacotar\boomcalc.iss'

      - name: Testar o instalador (instalar, abrir o programa instalado e desinstalar)
        shell: pwsh
        run: |
          $destino = Join-Path $env:RUNNER_TEMP "BoomCalc-instalado"
          $dados = Join-Path $env:LOCALAPPDATA "BoomCalc"
          $inst = Start-Process -FilePath "empacotar\saida\BoomCalc-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=$destino" -Wait -PassThru
          if ($inst.ExitCode -ne 0) { throw "O instalador terminou com código $($inst.ExitCode)." }
          if (-not (Test-Path "$destino\BoomCalc.exe")) { throw "O instalador não copiou o BoomCalc.exe." }
          if (-not (Test-Path "$destino\unins000.exe")) { throw "O desinstalador não foi criado." }
          Write-Host "Instalado em $destino, com desinstalador."

          $proc = Start-Process -FilePath "$destino\BoomCalc.exe" -ArgumentList "--no-browser","--port","5098" -PassThru
          try {
            $pronto = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 1
              try { $g = Invoke-RestMethod -Uri "http://127.0.0.1:5098/api/guindastes"; if ($g.Count -ge 2) { $pronto = $true; break } } catch { }
            }
            if (-not $pronto) { throw "O programa instalado não respondeu." }
            Write-Host "Programa instalado respondeu."
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
          Start-Sleep -Seconds 2
          if (-not (Test-Path $dados)) { throw "O programa instalado não criou a pasta de dados em $dados." }

          Start-Process -FilePath "$destino\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$destino\BoomCalc.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$destino\BoomCalc.exe") { throw "A desinstalação não removeu o programa." }
          Write-Host "Desinstalado: o programa foi removido."
          if (Test-Path $dados) { Write-Host "Pasta de dados mantida (em modo silencioso a pergunta usa a resposta padrão)." } else { Write-Host "Pasta de dados apagada." }

      - uses: actions/upload-artifact@v4
        with:
          name: BoomCalc-Setup
          path: empacotar/saida/BoomCalc-Setup.exe
